# InspIRCd 4 configuration for linking the Anope services container (compose.yaml in this folder).
# Copy to /etc/inspircd/services.conf, set the password, and include it from inspircd.conf:
#   <include file="/etc/inspircd/services.conf">
# Remove any <module> line here that inspircd.conf already loads.

# Server linking, and services integration (account tracking, +r, services-held nicks).
<module name="spanningtree">
<module name="account">
<module name="services">
<module name="hidechans">
<module name="chghost">
<module name="chgident">

# SASL. The test server is plaintext, so SASL must be allowed without TLS.
<module name="cap">
<module name="sasl">
<sasl target="services.gunnbr.org" requiressl="no">

# Port for services to connect to. Loopback only: InspIRCd 4 requires TLS for server links
# from any non-loopback address.
<bind address="127.0.0.1" port="7000" type="servers">

<link name="services.gunnbr.org"
      ipaddr="127.0.0.1"
      port="7000"
      allowmask="127.0.0.0/8"
      sendpass="<link password>"
      recvpass="<link password>">

<services server="services.gunnbr.org" silent="yes">
