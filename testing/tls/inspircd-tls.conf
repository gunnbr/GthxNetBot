# TLS listener for the local test IRC server, like Libera's port 6697.
# Install as /etc/inspircd/tls.conf and include it from inspircd.conf (see README.md).

# Remove this line if inspircd.conf already loads ssl_gnutls; InspIRCd won't start with a module loaded twice.
<module name="ssl_gnutls">

<sslprofile name="Clients"
            provider="gnutls"
            certfile="/etc/inspircd/tls/server.pem"
            keyfile="/etc/inspircd/tls/server.key">

<bind address="10.0.0.125" port="6697" type="clients" sslprofile="Clients">
