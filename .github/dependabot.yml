# Monthly update PRs, one per ecosystem, so updates arrive in a few batched PRs instead of one PR per package.
# (Security updates still arrive as soon as an advisory is published.) Every merge to master deploys,
# so each of these PRs still needs the usual deploy approval. The Docker base images aren't listed: the
# build pulls the latest 10.0 images every time.
version: 2
updates:
  # The bot's own projects; the Gthx.Data and IrcDotNet submodules' packages are updated in their own repos.
  - package-ecosystem: nuget
    directories:
      - /Gthx.Bot
      - /Gthx.Test
      - /GthxNetBot
      - /GthxNetBot.AppHost
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]


  # Moves the Gthx.Data submodule to the latest master of gunnbr/GthxNetData. (IrcDotNet stays where it
  # is: the fork's master isn't what the bot is built and tested against.)
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: Gthx.Data
