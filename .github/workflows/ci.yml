name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The SQL Server tests start a container with Testcontainers, using the runner's Docker.
      - name: Test
        run: dotnet test --configuration Release
