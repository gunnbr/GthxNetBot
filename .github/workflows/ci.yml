name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
          # The version number counts commits, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      # The solution doesn't build Gthx.Test in Release, so test the project itself.
      # The SQL Server tests start a container with Testcontainers, using the runner's Docker.
      - name: Test
        run: dotnet test Gthx.Test/Gthx.Test.csproj --configuration Release
