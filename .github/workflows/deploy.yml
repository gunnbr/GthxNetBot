# Tests, builds the image into Azure Container Registry, and deploys infra/main.bicep (including the
# container apps of all the bots, which run that same image) to Azure. The deploy job uses the "production" environment, so it
# waits for approval when that environment has required reviewers.
#
# Azure sign-in uses OpenID Connect (no stored Azure password), with two identities: the build job, which
# runs without approval, can only push images to the registry (AZURE_BUILD_CLIENT_ID); only the approved
# deploy job signs in as the identity that can change Azure (AZURE_CLIENT_ID). Repository variables:
#   AZURE_CLIENT_ID, AZURE_BUILD_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP,
#   AZURE_REGISTRY_NAME
# Repository secret:
#   BUDGET_CONTACT_EMAIL (where budget alerts go)
# Until AZURE_BUILD_CLIENT_ID is set, the build and deploy jobs are skipped. See infra/README.md.
name: Build and deploy to Azure

on:
  push:
    branches:
      - master
    # A push that changes only documentation doesn't need a new image or deploy.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: vars.AZURE_BUILD_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # The version number counts commits, so it needs the full history.
          fetch-depth: 0

      - name: Get the version number
        id: version
        run: |
          dotnet tool install nbgv --version 3.10.94 --tool-path "$RUNNER_TEMP/nbgv"
          echo "version=$("$RUNNER_TEMP/nbgv/nbgv" get-version --variable SimpleVersion)" >> "$GITHUB_OUTPUT"

      # The build identity can only read and push to the registry.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          registry="${{ vars.AZURE_REGISTRY_NAME }}"
          login_server=$(az acr show -n "$registry" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query loginServer -o tsv)
          az acr login -n "$registry"
          docker build --pull \
            -t "$login_server/gthxnetbot:${{ github.sha }}" \
            -t "$login_server/gthxnetbot:${{ steps.version.outputs.version }}" .
          docker push --all-tags "$login_server/gthxnetbot"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          BUDGET_CONTACT_EMAIL: ${{ secrets.BUDGET_CONTACT_EMAIL }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "gthx-${{ github.run_number }}" \
            --parameters infra/main.bicepparam \
            --query 'properties.provisioningState' -o tsv
